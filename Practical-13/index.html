<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            max-width: 850px;
            margin: 30px auto;
            padding: 15px;
        }

        h2 {
            color: navy;
            text-align: center;
        }

        h3 {
            color: #233b75;
        }

        form, .list {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 8px 0 12px;
        }

        button {
            padding: 9px 12px;
            margin: 3px;
            border: none;
            border-radius: 4px;
            background: royalblue;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: navy;
        }

        .delete-btn {
            background: #c62828;
        }

        .cancel-btn {
            background: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 9px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        th {
            background: #dce7ff;
            color: navy;
        }

        #status {
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <h2>Student Management System</h2>

    <form id="studentForm">
        <h3 id="formTitle">Add Student</h3>

        <label for="name">Student Name:</label>
        <input type="text" id="name"
               placeholder="Enter student name" required>

        <label for="email">Student Email:</label>
        <input type="email" id="email"
               placeholder="Enter student email" required>

        <button type="submit" id="saveButton">Add Student</button>

        <button type="button" id="cancelButton"
                class="cancel-btn" hidden>
            Cancel
        </button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <div class="list">
        <h3>Student List</h3>

        <p id="loading">Loading students...</p>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const api = "api.php";

        const form = document.getElementById("studentForm");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const table = document.getElementById("studentTable");
        const statusBox = document.getElementById("status");
        const loading = document.getElementById("loading");

        let students = [];
        let editingId = null;

        function showStatus(message, isError = false) {
            statusBox.textContent = message;
            statusBox.style.color = isError ? "red" : "green";
        }

        async function request(method, data = null) {
            const options = { method, headers: {} };

            if (data !== null) {
                options.headers["Content-Type"] = "application/json";
                options.body = JSON.stringify(data);
            }

            const response = await fetch(api, options);
            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Request failed.");
            }

            return result;
        }

        async function loadStudents() {
            loading.hidden = false;
            loading.textContent = "Loading students...";

            try {
                const result = await request("GET");
                students = result.data;

                renderStudents();
                loading.hidden = true;

            } catch (error) {
                loading.textContent = "Unable to load students.";
                showStatus(error.message, true);
            }
        }

        function renderStudents() {
            table.replaceChildren();

            if (students.length === 0) {
                const row = table.insertRow();
                const cell = row.insertCell();

                cell.colSpan = 4;
                cell.textContent = "No students found.";
                return;
            }

            students.forEach(student => {
                const row = table.insertRow();

                [student.id, student.name, student.email]
                    .forEach(value => {
                        const cell = row.insertCell();
                        cell.textContent = value;
                    });

                const actions = row.insertCell();

                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.addEventListener("click", () => {
                    editStudent(student.id);
                });

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";
                deleteButton.addEventListener("click", () => {
                    deleteStudent(student.id);
                });

                actions.append(editButton, deleteButton);
            });
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const data = {
                name: nameInput.value.trim(),
                email: emailInput.value.trim()
            };

            if (!data.name || !data.email) {
                showStatus("Please fill in all fields.", true);
                return;
            }

            try {
                let result;

                if (editingId === null) {
                    result = await request("POST", data);
                } else {
                    result = await request("PUT", {
                        ...data,
                        id: editingId
                    });
                }

                showStatus(result.message);

                form.reset();
                resetForm();

                await loadStudents();

            } catch (error) {
                showStatus(error.message, true);
            }
        });

        function editStudent(id) {
            const student = students.find(
                item => Number(item.id) === Number(id)
            );

            if (!student) return;

            editingId = student.id;
            nameInput.value = student.name;
            emailInput.value = student.email;

            document.getElementById("formTitle").textContent =
                "Update Student";

            document.getElementById("saveButton").textContent =
                "Update Student";

            document.getElementById("cancelButton").hidden = false;

            nameInput.focus();
        }

        function resetForm() {
            editingId = null;

            document.getElementById("formTitle").textContent =
                "Add Student";

            document.getElementById("saveButton").textContent =
                "Add Student";

            document.getElementById("cancelButton").hidden = true;
        }

        document.getElementById("cancelButton")
            .addEventListener("click", function() {
                form.reset();
                resetForm();
                showStatus("Edit cancelled.");
            });

        async function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student?")) {
                return;
            }

            try {
                const result = await request("DELETE", { id });

                showStatus(result.message);
                await loadStudents();

                if (Number(editingId) === Number(id)) {
                    form.reset();
                    resetForm();
                }

            } catch (error) {
                showStatus(error.message, true);
            }
        }

        loadStudents();
    </script>

</body>
</html>
