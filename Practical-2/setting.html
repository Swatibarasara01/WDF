<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
</head>
<body>

<fieldset>

<legend align="center">
    <b>⚙ Settings</b>
</legend>

<form>

<table cellpadding="10">

<tr>
    <td><b>Change Profile Picture:</b></td>
    <td>
        <input type="file" accept=".jpg,.jpeg,.png">
    </td>
</tr>

<tr>
    <td><b>Change Username:</b></td>
    <td>
        <input type="text" placeholder="Enter Username">
    </td>
</tr>

<tr>
    <td><b>Change Email:</b></td>
    <td>
        <input type="email" placeholder="Enter Email">
    </td>
</tr>

<tr>
    <td><b>Change Password:</b></td>
    <td>
        <input type="password" placeholder="New Password">
    </td>
</tr>

<tr>
    <td><b>Confirm Password:</b></td>
    <td>
        <input type="password" placeholder="Confirm Password">
    </td>
</tr>

<tr>
    <td><b>Language:</b></td>
    <td>
        <select>
            <option>English</option>
            <option>Hindi</option>
            <option>Gujarati</option>
        </select>
    </td>
</tr>

<tr>
    <td><b>Theme:</b></td>
    <td>
        <input type="radio" name="theme"> Light
        <input type="radio" name="theme"> Dark
    </td>
</tr>

<tr>
    <td><b>Email Notifications:</b></td>
    <td>
        <input type="checkbox"> Enable
    </td>
</tr>

<tr>
    <td><b>SMS Notifications:</b></td>
    <td>
        <input type="checkbox"> Enable
    </td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Save Settings">
        <input type="reset" value="Reset">
    </td>
</tr>

</table>

</form>

<a href="dashboard.html">
    <button type="button">⬅ Back to Dashboard</button>
</a>

</fieldset>

</body>
</html>
