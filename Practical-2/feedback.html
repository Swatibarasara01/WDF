<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../Practical-3/Style.css">
    <meta charset="UTF-8">
    <title>Faculty Feedback Form</title>
</head>
<body>

<h1 align="center">Feedback Form</h1>

<form>

<fieldset>

<legend><b>Student Details</b></legend>

<label>Student Name :</label><br>
<input type="text" name="studentname"><br><br>

<label>Student ID :</label><br>
<input type="text" name="studentid"><br><br>

<label>Department :</label><br>
<input type="text" name="department"><br><br>

<label>Semester :</label><br>
<input type="text" name="semester"><br><br>

</fieldset>

<br>

<fieldset>

<legend><b>Faculty Details</b></legend>

<label>Faculty Name :</label><br>
<input type="text" name="faculty"><br><br>

<label>Subject :</label><br>
<input type="text" name="subject"><br><br>

</fieldset>

<br>

<fieldset>

<legend><b>Rate Your Faculty</b></legend>

<label>1. Teaching Quality</label><br>
<input type="radio" name="teaching"> Excellent
<input type="radio" name="teaching"> Good
<input type="radio" name="teaching"> Average
<input type="radio" name="teaching"> Poor

<br><br>

<label>2. Communication Skills</label><br>
<input type="radio" name="communication"> Excellent
<input type="radio" name="communication"> Good
<input type="radio" name="communication"> Average
<input type="radio" name="communication"> Poor

<br><br>

<label>3. Subject Knowledge</label><br>
<input type="radio" name="knowledge"> Excellent
<input type="radio" name="knowledge"> Good
<input type="radio" name="knowledge"> Average
<input type="radio" name="knowledge"> Poor

<br><br>

<label>4. Punctuality</label><br>
<input type="radio" name="time"> Excellent
<input type="radio" name="time"> Good
<input type="radio" name="time"> Average
<input type="radio" name="time"> Poor

<br><br>

<label>5. Doubt Solving Ability</label><br>
<input type="radio" name="doubt"> Excellent
<input type="radio" name="doubt"> Good
<input type="radio" name="doubt"> Average
<input type="radio" name="doubt"> Poor

</fieldset>

<br>

<fieldset>

<legend><b>Overall Rating</b></legend>

<select>
<option>Select Rating</option>
<option>⭐⭐⭐⭐⭐ Excellent</option>
<option>⭐⭐⭐⭐ Very Good</option>
<option>⭐⭐⭐ Good</option>
<option>⭐⭐ Average</option>
<option>⭐ Poor</option>
</select>

</fieldset>

<br>

<fieldset>

<legend><b>Suggestions</b></legend>

<textarea rows="6" cols="60" placeholder="Write your suggestions here..."></textarea>

</fieldset>

<br>

<input type="submit" value="Submit Feedback">
<input type="reset" value="Clear Form">

<br><br>

<a href="dashboard.html">
<button type="button">Back to Dashboard</button>
</a>

</form>

</body>
</html>
